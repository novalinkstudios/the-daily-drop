name: Daily Drop

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and write today's drop
        run: python generate_drop.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drops.json index.html
          git diff --staged --quiet && echo "Already up to date." || (git commit -m "drops: $(date +%Y-%m-%d)" && git push)
